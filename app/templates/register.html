<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Akun Warga - Portal Bansos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

  <div class="max-w-[460px] w-full bg-white rounded-2xl border border-slate-200/90 shadow-sm p-8 sm:p-10 my-8">

    <!-- Brand Logo Icon & Subtitle -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-[#009ee2] text-white flex items-center justify-center font-bold text-2xl mx-auto mb-3 shadow-xs">
        B
      </div>
      <div class="text-sm font-semibold text-slate-700 tracking-tight">Portal Bansos</div>
      <h1 class="text-xl font-bold text-slate-900 mt-5">Buat Akun Warga Baru</h1>
      <p class="text-xs text-slate-500 mt-1">Daftar untuk mengajukan dan memantau status bansos Anda</p>
    </div>

    <!-- Flash message -->
    {% if request.query_params.get('error') %}
      <div class="mb-4 p-3 rounded-lg text-xs font-medium bg-rose-50 border border-rose-200 text-rose-700 text-left">
        {{ request.query_params.get('error') }}
      </div>
    {% endif %}

    <!-- Form Register -->
    <form action="/auth/register" method="POST" class="space-y-4 text-left">
      <div>
        <label for="nik" class="block text-xs font-semibold text-slate-700 mb-1.5">
          Nomor Induk Kependudukan (NIK) <span class="text-rose-500">*</span>
        </label>
        <input type="text" id="nik" name="nik" required maxlength="16" minlength="16" pattern="\d{16}"
          placeholder="16 digit angka NIK KTP Anda"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#009ee2] focus:border-transparent text-sm transition" />
      </div>

      <div>
        <label for="nama" class="block text-xs font-semibold text-slate-700 mb-1.5">
          Nama Lengkap (Sesuai KTP) <span class="text-rose-500">*</span>
        </label>
        <input type="text" id="nama" name="nama" required placeholder="Contoh: Budi Santoso"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#009ee2] focus:border-transparent text-sm transition" />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">
          Kata Sandi <span class="text-rose-500">*</span>
        </label>
        <input type="password" id="password" name="password" required minlength="6" placeholder="Minimal 6 karakter"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#009ee2] focus:border-transparent text-sm transition" />
      </div>

      <div>
        <label for="password_confirm" class="block text-xs font-semibold text-slate-700 mb-1.5">
          Konfirmasi Kata Sandi <span class="text-rose-500">*</span>
        </label>
        <input type="password" id="password_confirm" name="password_confirm" required minlength="6" placeholder="Ulangi kata sandi"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#009ee2] focus:border-transparent text-sm transition" />
      </div>

      <button type="submit"
        class="w-full py-2.5 px-4 rounded-lg text-white font-semibold bg-[#009ee2] hover:bg-[#0284c7] shadow-sm transition mt-2 text-sm">
        Daftar Sekarang
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-600">
      Sudah memiliki akun?
      <a href="/auth/login" class="text-[#009ee2] font-semibold hover:underline">Masuk ke akun</a>
    </div>

  </div>

</body>
</html>
